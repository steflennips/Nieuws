name: Nieuws verversen en publiceren

on:
  schedule:
    # Dagelijks om 04:00 UTC = 06:00 Nederlandse zomertijd (05:00 in de winter).
    # GitHub kan geplande jobs enkele minuten tot uren uitstellen.
    - cron: "0 4 * * *"
  workflow_dispatch:   # handmatig starten: tabblad Actions > "Nieuws verversen en publiceren" > Run workflow

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nodig om data/nieuws.json terug te committen (standaard GITHUB_TOKEN, geen eigen sleutel)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nieuws ophalen
        run: python src/ophalen.py

      - name: Site bouwen
        run: python src/bouw.py

      - name: Nieuwe data bewaren in de repository
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # data/nieuws.json is een door deze job gegenereerd bestand: de zojuist gebouwde versie wint altijd.
          # Daarom geen rebase/merge (kan conflicteren als er tussentijds is gepusht), maar: bestand opzij zetten,
          # naar de actuele remote-stand gaan, het bestand terugzetten, committen en pushen (nooit force).
          if [ -n "$(git status --porcelain data/nieuws.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp data/nieuws.json "$RUNNER_TEMP/nieuws.json"
            gelukt=nee
            for poging in 1 2 3; do
              echo "Poging $poging van 3"
              if git fetch origin "$BRANCH" && git reset --hard "origin/$BRANCH"; then
                cp "$RUNNER_TEMP/nieuws.json" data/nieuws.json
                git add data/nieuws.json
                if git diff --cached --quiet; then
                  echo "data/nieuws.json is op de remote al gelijk aan de nieuwe versie"
                  gelukt=ja
                  break
                fi
                git commit -m "Nieuws bijgewerkt"
                if git push origin "HEAD:$BRANCH"; then
                  gelukt=ja
                  break
                fi
              fi
              sleep $((poging * 5))
            done
            if [ "$gelukt" != "ja" ]; then
              # De site is al gebouwd uit de verse data en wordt gewoon gepubliceerd; alleen de opslag in de repo mislukte.
              echo "::warning title=Nieuws niet teruggezet in de repository::data/nieuws.json kon na 3 pogingen niet worden gepusht. De site wordt wel gepubliceerd; de volgende run probeert het opnieuw."
              echo "### Waarschuwing: data/nieuws.json niet teruggezet in de repository (3 pogingen mislukt). De site is wel gepubliceerd." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Geen wijzigingen in data/nieuws.json"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
